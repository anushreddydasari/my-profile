<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="expenses-nav">
        <a href="../index.html">&#x2190; Home</a>
        <h1>Expenses Tracker</h1>
    </nav>
    <main>
        <section class="expense-form-section">
            <form id="expense-form" autocomplete="off">
              <div class="form-group">
                <label for="desc">Description<span>*</span></label>
                <input type="text" id="desc" name="desc" required>
              </div>
              <div class="form-group">
                <label for="amt">Amount (INR)<span>*</span></label>
                <input type="number" id="amt" name="amt" step="0.01" min="0" required>
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                  <option value="Food">Food</option>
                  <option value="Travel">Travel</option>
                  <option value="Bills">Bills</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
              </div>
              <div id="form-error" role="alert"></div>
              <button type="submit" class="form-btn">Add Expense</button>
            </form>
        </section>
        <section class="expense-controls">
            <div class="month-select-group">
                <label for="month-select">Month: </label>
                <input type="month" id="month-select">
            </div>
            <button id="export-csv" class="export-btn">Export CSV</button>
        </section>
        <section class="summary-container">
            <div class="summary-card" id="summary-total">
              <span class="summary-label">Total</span>
              <span id="summary-total-value">₹0</span>
            </div>
            <div class="summary-card" id="summary-count">
              <span class="summary-label">Expenses</span>
              <span id="summary-count-value">0</span>
            </div>
            <div class="summary-card" id="summary-category">
              <span class="summary-label">Largest Category</span>
              <span id="summary-category-value">—</span>
            </div>
        </section>
        <section class="bar-chart-section">
            <h2>Spending by Category</h2>
            <div id="bar-chart" class="bar-chart"></div>
        </section>
        <section class="expenses-list-section">
            <h2>Expenses</h2>
            <ul id="expenses-list" class="expenses-list"></ul>
        </section>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
