<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anush Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shop-header">
    <div class="shop-header-row">
      <h1 class="shop-title">Anush Store</h1>
      <button class="cart-btn" id="cartBtn">
        🛒 <span id="cartCount">0</span>
      </button>
    </div>
    <div class="shop-filter-row">
      <input type="text" id="searchBox" placeholder="Search products..." aria-label="Search products">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>
    </div>
  </header>
  <main>
    <section id="productGrid" class="product-grid"></section>
    <aside id="cartPanel" class="cart-panel hidden" aria-modal="true"></aside>
    <div id="checkoutModal" class="checkout-modal hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
