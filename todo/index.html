<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-container">
    <h1>To-Do List</h1>
    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="Add a new task..." maxlength="60">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <div class="filters">
      <button type="button" data-filter="all" class="filter-btn active">All</button>
      <button type="button" data-filter="active" class="filter-btn">Active</button>
      <button type="button" data-filter="done" class="filter-btn">Done</button>
    </div>
    <ul id="todo-list"></ul>
    <div id="remaining" class="remaining-count"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
